<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F-chat">
<meta name="theme-color" content="#1E2637">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>F-chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--yellow:#FEE500;--bg:#B2C7D9;--sidebar:#1E2637;--header:#1A4A72;}
  html{height:100%;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);display:flex;height:100dvh;overflow:hidden;}

  /* ===== 오버레이 공통 ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;z-index:500;
  }
  .overlay.hidden{display:none;}
  .modal{
    background:#fff;border-radius:20px;padding:32px 28px;
    width:min(320px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;
  }
  .modal h3{font-size:18px;font-weight:700;color:#333;margin-bottom:8px;}
  .modal p{font-size:13px;color:#888;margin-bottom:20px;line-height:1.5;}
  .modal input{
    width:100%;padding:12px 16px;border:2px solid #eee;border-radius:10px;
    font-family:'Noto Sans KR',sans-serif;font-size:16px;margin-bottom:12px;
    outline:none;transition:border-color .2s;text-align:center;letter-spacing:4px;
  }
  .modal input.name-input{letter-spacing:0;text-align:left;font-size:15px;}
  .modal input:focus{border-color:var(--yellow);}
  .modal-btn{
    width:100%;padding:13px;background:var(--yellow);border:none;border-radius:10px;
    font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;color:#333;cursor:pointer;margin-bottom:8px;
  }
  .modal-btn.secondary{background:#f5f5f5;color:#555;}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin:16px 0;}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:#eee;transition:background .15s;}
  .pin-dot.filled{background:#333;}

  /* ===== 로그인 화면 ===== */
  #login-screen{
    position:fixed;inset:0;
    background:linear-gradient(135deg,#1E2637,#1A4A72);
    display:flex;align-items:center;justify-content:center;z-index:1000;
  }
  .login-box{
    background:#fff;border-radius:20px;padding:36px 28px;
    width:min(340px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;
  }
  .login-logo{
    width:64px;height:64px;background:var(--yellow);border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;
  }
  .login-box h2{font-size:20px;font-weight:700;color:#333;margin-bottom:6px;}
  .login-box .subtitle{font-size:13px;color:#888;margin-bottom:20px;}

  /* 멤버 선택 버튼 */
  .member-select{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .member-btn{
    padding:12px 16px;border:2px solid #eee;border-radius:12px;background:#fff;
    cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;
    display:flex;align-items:center;gap:12px;
  }
  .member-btn:hover,.member-btn.selected{border-color:var(--yellow);background:#fffde7;}
  .member-btn .m-avatar{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;color:#fff;flex-shrink:0;
  }
  .member-btn .m-info{text-align:left;}
  .member-btn .m-name{font-size:15px;font-weight:600;color:#333;}
  .member-btn .m-status{font-size:12px;color:#aaa;margin-top:1px;}

  /* PIN 입력 키패드 */
  #pin-screen{display:none;}
  #pin-screen.show{display:block;}
  .pin-title{font-size:16px;font-weight:700;color:#333;margin-bottom:4px;}
  .pin-subtitle{font-size:13px;color:#888;margin-bottom:4px;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px;}
  .key{
    padding:16px 0;border:none;background:#f7f7f7;border-radius:12px;
    font-size:20px;font-weight:600;color:#333;cursor:pointer;transition:background .15s;
    font-family:'Noto Sans KR',sans-serif;
  }
  .key:active{background:#eee;}
  .key.del{font-size:16px;color:#888;}
  .key.empty{background:transparent;cursor:default;}
  .back-login-btn{
    width:100%;padding:10px;background:none;border:none;
    font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#aaa;cursor:pointer;margin-top:4px;
  }

  /* ===== 텍스트 아바타 ===== */
  .txt-avatar{
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;flex-shrink:0;
  }

  /* ===== 사이드바 ===== */
  #sidebar{width:280px;min-width:280px;background:var(--sidebar);display:flex;flex-direction:column;color:#fff;height:100%;}
  .sidebar-header{
    padding:max(16px,env(safe-area-inset-top)) 16px 16px;
    background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
  }
  .my-profile{display:flex;align-items:center;gap:12px;}
  .my-name{font-size:15px;font-weight:600;}
  .my-status{font-size:12px;opacity:.5;margin-top:2px;}
  .edit-name-btn{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:4px;}
  .sidebar-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
  .tab-btn{flex:1;padding:12px 8px;text-align:center;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
  .tab-btn.active{color:var(--yellow);border-bottom-color:var(--yellow);}
  .room-list{flex:1;overflow-y:auto;padding:8px 0;}
  .room-item{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s;}
  .room-item:active,.room-item.active{background:rgba(254,229,0,.12);}
  .room-avatar-wrap{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
  .room-info{flex:1;min-width:0;}
  .room-name{font-size:14px;font-weight:600;margin-bottom:3px;}
  .room-preview{font-size:12px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .room-time{font-size:11px;opacity:.4;white-space:nowrap;}
  .member-panel{flex:1;overflow-y:auto;padding:12px 12px 20px;}
  .member-panel-title{font-size:11px;opacity:.4;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;padding:0 4px;}
  /* 가족 카드 */
  .member-card{
    background:rgba(255,255,255,.07);border-radius:16px;
    padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;
  }
  .member-card-top{display:flex;align-items:center;gap:12px;}
  .member-card-photo{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;color:#fff;cursor:pointer;position:relative;overflow:hidden;
  }
  .member-card-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .member-card-photo .photo-edit{
    position:absolute;inset:0;background:rgba(0,0,0,.4);
    display:none;align-items:center;justify-content:center;font-size:16px;border-radius:50%;
  }
  .member-card-photo:hover .photo-edit{display:flex;}
  .member-card-info{flex:1;}
  .member-card-name{font-size:15px;font-weight:700;}
  .member-card-online{font-size:12px;opacity:.5;margin-top:2px;}
  .member-card-online.on{color:#52C788;opacity:1;}
  .member-card-actions{display:flex;gap:8px;}
  .card-btn{
    flex:1;padding:8px 4px;border:none;border-radius:10px;
    font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;
    cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .card-btn:active{opacity:.7;}
  .card-btn.chat{background:var(--yellow);color:#333;}
  .card-btn.memo{background:rgba(255,255,255,.12);color:#fff;}

  /* ===== 채팅 ===== */
  #chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-width:0;}
  .chat-header{
    padding:max(14px,env(safe-area-inset-top)) 20px 14px;
    background:var(--header);color:#fff;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);flex-shrink:0;
  }
  .chat-header .room-title{font-size:16px;font-weight:700;}
  .chat-header .sub{font-size:12px;opacity:.6;}
  .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;}
  .date-divider{display:flex;align-items:center;gap:12px;margin:12px 0;}
  .date-divider span{font-size:12px;color:rgba(0,0,0,.4);background:rgba(255,255,255,.6);padding:4px 12px;border-radius:20px;white-space:nowrap;}
  .date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.15);}
  .msg-row{display:flex;gap:8px;align-items:flex-end;}
  .msg-row.me{flex-direction:row-reverse;}
  .msg-row.me .msg-info{align-items:flex-end;}
  .msg-avatar-wrap{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;align-self:flex-start;}
  .msg-info{display:flex;flex-direction:column;gap:3px;}
  .msg-sender{font-size:12px;color:rgba(0,0,0,.5);font-weight:500;padding-left:2px;}
  .msg-content{display:flex;align-items:flex-end;gap:4px;}
  .msg-row.me .msg-content{flex-direction:row-reverse;}
  .bubble{max-width:min(240px,65vw);padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .bubble.me{background:var(--yellow);color:#333;border-bottom-right-radius:4px;}
  .bubble.other{background:#fff;color:#333;border-bottom-left-radius:4px;}
  .bubble.system{background:rgba(0,0,0,.12);color:rgba(0,0,0,.5);font-size:12px;padding:6px 14px;border-radius:20px;margin:4px auto;max-width:none;}
  .msg-time{font-size:11px;color:rgba(0,0,0,.35);white-space:nowrap;}
  .msg-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;justify-content:flex-end;}
  .msg-unread{font-size:11px;color:#4A90D9;white-space:nowrap;font-weight:600;}
  .bubble img{max-width:100%;border-radius:10px;display:block;cursor:pointer;}
  .bubble{-webkit-user-select:none;user-select:none;}
  .chat-messages{-webkit-user-select:none;user-select:none;}
  .chat-input-area{
    display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.95);
    border-top:1px solid rgba(0,0,0,.08);padding:10px 12px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));flex-shrink:0;
  }
  .input-btn{width:36px;height:36px;border-radius:50%;border:none;background:#e8e8e8;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #msg-input{flex:1;border:1.5px solid #ddd;border-radius:20px;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:14px;background:#fff;resize:none;line-height:1.5;padding:8px 14px;max-height:100px;overflow-y:auto;}
  #msg-input:focus{border-color:var(--yellow);}
  .send-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--yellow);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(0,0,0,.3);gap:12px;}
  .empty-chat .icon{font-size:48px;}
  #img-preview{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:center;justify-content:center;}
  #img-preview.show{display:flex;}
  #img-preview img{max-width:90vw;max-height:90vh;border-radius:12px;}
  #img-preview-close{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;cursor:pointer;}

  /* PWA 배너 */
  #install-banner{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1E2637;color:#fff;border-radius:16px;padding:14px 20px;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:500;width:min(320px,90vw);}
  #install-banner.show{display:flex;}
  #install-banner .i-text{flex:1;}
  #install-banner .i-text strong{display:block;font-size:14px;margin-bottom:2px;}
  #install-banner .i-text span{font-size:12px;opacity:.6;}
  #install-btn{background:var(--yellow);color:#333;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
  #install-close{background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;padding:0 4px;}

  /* 선택된 말풍선 */
  .selected-bubble { outline: 3px solid #4A90D9 !important; opacity: 0.85; }
  #chat-main{display:none;flex-direction:column;flex:1;overflow:hidden;}
  #chat-main.visible{display:flex;}
  .back-btn{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 4px;}
  ::-webkit-scrollbar{width:3px;}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}

  @media(max-width:640px){
    #sidebar{width:100%;position:fixed;z-index:100;height:100dvh;transition:transform .3s ease;transform:translateX(0);}
    #sidebar.hidden{transform:translateX(-100%);}
    #chat-area{width:100%;}
    .back-btn{display:flex!important;}
  }
</style>
</head>
<body>



<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">💬</div>
    <h2>F-chat</h2>
    <div class="subtitle" id="login-subtitle">가족 구성원을 선택하세요</div>
    <!-- 멤버 선택 -->
    <div class="member-select" id="member-select"></div>
    <!-- PIN 입력 영역 -->
    <div id="pin-screen">
      <div class="pin-title" id="pin-title">PIN 입력</div>
      <div class="pin-subtitle" id="pin-subtitle">6자리 PIN을 입력하세요</div>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="keypad" id="keypad"></div>
      <button class="back-login-btn" onclick="backToMemberSelect()">← 돌아가기</button>
    </div>
  </div>
</div>

<!-- 이름 변경 모달 -->
<div class="overlay hidden" id="name-modal">
  <div class="modal">
    <h3>이름 변경</h3>
    <p>새 이름을 입력하세요</p>
    <input class="name-input" type="text" id="new-name-input" placeholder="이름" maxlength="10">
    <button class="modal-btn" onclick="saveName()">저장</button>
    <button class="modal-btn secondary" onclick="document.getElementById('name-modal').classList.add('hidden')">취소</button>
  </div>
</div>

<!-- 이미지 미리보기 -->
<div id="img-preview" onclick="this.classList.remove('show')">
  <span id="img-preview-close">✕</span>
  <img id="img-preview-src" src="" alt="">
</div>

<!-- PWA 배너 -->
<div id="install-banner">
  <div class="i-text"><strong>앱으로 설치하기</strong><span>홈 화면에 추가하면 더 편해요</span></div>
  <button id="install-btn" onclick="installPWA()">설치</button>
  <button id="install-close" onclick="document.getElementById('install-banner').classList.remove('show')">✕</button>
</div>

<!-- 사이드바 -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="my-profile">
      <div class="txt-avatar" id="my-avatar" style="width:40px;height:40px;font-size:16px;border-radius:12px;"></div>
      <div style="flex:1">
        <div class="my-name" id="my-name-display"></div>
        <div class="my-status">온라인</div>
      </div>
      <button class="edit-name-btn" onclick="openNameModal()" title="이름 변경">✏️</button>
    </div>
  </div>
  <div class="sidebar-tabs">
    <div class="tab-btn active" onclick="switchTab('chats')">💬 채팅</div>
    <div class="tab-btn" onclick="switchTab('members')">👥 가족</div>
  </div>
  <div class="room-list" id="room-list"></div>
  <div class="member-panel" id="member-panel" style="display:none">
    <div class="member-panel-title">가족 구성원</div>
    <div id="member-cards"></div>
    <!-- 나와의 채팅 -->
    <div class="member-card" style="background:rgba(102,126,234,.15);border:1px solid rgba(102,126,234,.25);cursor:pointer;" onclick="openMemoRoom()">
      <div class="member-card-top">
        <div class="member-card-photo" style="background:linear-gradient(135deg,#667eea,#764ba2);font-size:18px;font-weight:700;">나</div>
        <div class="member-card-info">
          <div class="member-card-name">나와의 채팅</div>
          <div class="member-card-online">나만 보이는 메모장</div>
        </div>
        <div style="font-size:20px;opacity:.5;">→</div>
      </div>
    </div>
  </div>
</div>

<!-- 채팅 영역 -->
<div id="chat-area">
  <div class="empty-chat" id="empty-chat"><div class="icon">💬</div><p>채팅방을 선택하세요</p></div>
  <div id="chat-main">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChatMobile()">←</button>
      <div id="header-avatar" style="width:36px;height:36px;border-radius:50%;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"></div>
      <div style="flex:1;margin-left:8px">
        <div class="room-title" id="header-title"></div>
        <div class="sub" id="header-subtitle"></div>
      </div>

    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <!-- 선택 삭제 바 (나와의 채팅 전용) -->
    <div id="select-bar" style="display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff3f3;border-top:1px solid #ffcdd2;flex-shrink:0;">
      <span id="select-count" style="font-size:14px;font-weight:600;color:#e53935;font-family:'Noto Sans KR',sans-serif;">0개 선택됨</span>
      <div style="display:flex;gap:8px;">
        <button onclick="cancelSelect()" style="padding:7px 14px;border:none;border-radius:8px;background:#eee;font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;">취소</button>
        <button onclick="deleteSelected()" style="padding:7px 14px;border:none;border-radius:8px;background:#e53935;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">삭제</button>
      </div>
    </div>
    <div class="chat-input-area" id="chat-input-area">
      <button class="input-btn" onclick="document.getElementById('file-input').click()">📎</button>
      <input type="file" id="file-input" accept="image/*" onchange="sendImage(event)" style="display:none">
      <input type="file" id="photo-input" accept="image/*" onchange="uploadProfilePhoto(event)" style="display:none">
      <textarea id="msg-input" placeholder="메시지를 입력하세요" rows="1" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, get, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwpGzgxFx12pEj1iXoTbcE2u6NBKsB_Fw",
  authDomain: "family-chat-5ea4d.firebaseapp.com",
  databaseURL: "https://family-chat-5ea4d-default-rtdb.firebaseio.com",
  projectId: "family-chat-5ea4d",
  storageBucket: "family-chat-5ea4d.firebasestorage.app",
  messagingSenderId: "945645043864",
  appId: "1:945645043864:web:cbdbe47e0b2910227f50ed"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ★ 마스터 코드 (가족만 아는 비밀 코드 - 필요시 변경)
const MASTER_CODE = 'fchat2025';

// 멤버 기본 정의 (이름/색상은 Firebase에서 로드)
const MEMBER_DEFS = [
  { id:'member1', defaultName:'아빠', color:'#4A90D9' },
  { id:'member2', defaultName:'엄마', color:'#E67E9A' },
  { id:'member3', defaultName:'아들', color:'#52C788' },
  { id:'member4', defaultName:'딸',  color:'#F5A623' },
];

const ROOMS = [
  { id:'family', name:'우리 가족', isGroup:true,  members:['member1','member2','member3','member4'] },
  { id:'dm_1_2', isGroup:false, members:['member1','member2'] },
  { id:'dm_1_3', isGroup:false, members:['member1','member3'] },
  { id:'dm_1_4', isGroup:false, members:['member1','member4'] },
  { id:'dm_2_3', isGroup:false, members:['member2','member3'] },
  { id:'dm_2_4', isGroup:false, members:['member2','member4'] },
  { id:'dm_3_4', isGroup:false, members:['member3','member4'] },
];

let members = {}; // { member1: { name, color, hasPin } }
let currentUser = null, currentRoom = null, msgListener = null;
let pinBuffer = '', pinMode = ''; // 'login' | 'set1' | 'set2' | 'master'
let pinTemp = ''; // set2에서 첫번째 입력 저장
let selectedMemberId = null;

// ===== 아바타 헬퍼 =====
function avatarLetter(name) { return name ? name.charAt(0) : '?'; }
function memberColor(id) { return (MEMBER_DEFS.find(m=>m.id===id)||{}).color || '#999'; }
function memberName(id) { return members[id]?.name || MEMBER_DEFS.find(m=>m.id===id)?.defaultName || '?'; }

function makeAvatarEl(id, size=36, radius='50%') {
  const div = document.createElement('div');
  div.className = 'txt-avatar';
  div.style.cssText = `width:${size}px;height:${size}px;border-radius:${radius};font-size:${Math.round(size*0.4)}px;background:${memberColor(id)};`;
  div.textContent = avatarLetter(memberName(id));
  return div;
}

// ===== Firebase 멤버 정보 로드 =====
async function loadMembers() {
  const snap = await get(ref(db, 'members'));
  const data = snap.val() || {};
  MEMBER_DEFS.forEach(def => {
    members[def.id] = {
      name: data[def.id]?.name || def.defaultName,
      color: def.color,
      hasPin: !!data[def.id]?.pinHash,
      pinHash: data[def.id]?.pinHash || null,
    };
  });
}

// 간단 해시 (PIN → 숫자열)
async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin + 'fchat_salt'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ===== 로그인 UI =====
async function initLoginUI() {
  await loadMembers();
  const c = document.getElementById('member-select');
  c.innerHTML = '';
  MEMBER_DEFS.forEach(def => {
    const btn = document.createElement('button');
    btn.className = 'member-btn';
    const av = document.createElement('div');
    av.className = 'm-avatar';
    av.style.background = def.color;
    av.textContent = avatarLetter(members[def.id].name);
    const info = document.createElement('div');
    info.className = 'm-info';
    info.innerHTML = `<div class="m-name">${members[def.id].name}</div><div class="m-status">${members[def.id].hasPin ? '● 등록됨' : '○ PIN 미설정'}</div>`;
    btn.appendChild(av);
    btn.appendChild(info);
    btn.onclick = () => selectMember(def.id);
    c.appendChild(btn);
  });
}

function selectMember(id) {
  selectedMemberId = id;
  document.getElementById('member-select').style.display = 'none';
  document.getElementById('login-subtitle').style.display = 'none';
  const ps = document.getElementById('pin-screen');
  ps.classList.add('show');
  pinBuffer = '';
  if (members[id].hasPin) {
    pinMode = 'login';
    document.getElementById('pin-title').textContent = `${members[id].name}`;
    document.getElementById('pin-subtitle').textContent = 'PIN 6자리를 입력하세요';
  } else {
    pinMode = 'set1';
    document.getElementById('pin-title').textContent = `${members[id].name}`;
    document.getElementById('pin-subtitle').textContent = '사용할 PIN 6자리를 설정하세요';
  }
  renderDots(0);
  buildKeypad();
}

window.backToMemberSelect = function() {
  selectedMemberId = null;
  pinBuffer = ''; pinMode = '';
  document.getElementById('member-select').style.display = 'flex';
  document.getElementById('login-subtitle').style.display = 'block';
  document.getElementById('pin-screen').classList.remove('show');
};

function buildKeypad() {
  const kp = document.getElementById('keypad');
  kp.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'key' + (k==='del'?' del':k===''?' empty':'');
    btn.textContent = k === 'del' ? '⌫' : k;
    if (k !== '') btn.onclick = () => keyPress(k);
    kp.appendChild(btn);
  });
}

function renderDots(len) {
  document.querySelectorAll('.pin-dot').forEach((d,i) => {
    d.classList.toggle('filled', i < len);
  });
}

async function keyPress(k) {
  if (k === 'del') {
    pinBuffer = pinBuffer.slice(0,-1);
    renderDots(pinBuffer.length);
    return;
  }
  if (pinBuffer.length >= 6) return;
  pinBuffer += k;
  renderDots(pinBuffer.length);

  if (pinBuffer.length === 6) {
    await processPIN(pinBuffer);
  }
}

async function processPIN(pin) {
  // 마스터 코드 체크 (항상 허용)
  if (pin === MASTER_CODE.slice(0,6) || pin === MASTER_CODE) {
    // 마스터코드는 별도 처리 - 6자리면 숫자만이므로 텍스트 마스터는 별도 입력 불가
    // → 마스터코드를 숫자 6자리로 관리하려면 MASTER_CODE를 숫자로 바꾸면 됨
  }

  if (pinMode === 'login') {
    const hash = await hashPin(pin);
    if (hash === members[selectedMemberId].pinHash) {
      doLogin(selectedMemberId);
    } else {
      showPinError('PIN이 틀렸어요');
    }
  } else if (pinMode === 'set1') {
    pinTemp = pin;
    pinBuffer = '';
    pinMode = 'set2';
    document.getElementById('pin-subtitle').textContent = '한 번 더 입력하세요 (확인)';
    renderDots(0);
  } else if (pinMode === 'set2') {
    if (pin === pinTemp) {
      const hash = await hashPin(pin);
      await set(ref(db, `members/${selectedMemberId}/pinHash`), hash);
      if (!members[selectedMemberId].name || members[selectedMemberId].name === MEMBER_DEFS.find(d=>d.id===selectedMemberId).defaultName) {
        await set(ref(db, `members/${selectedMemberId}/name`), members[selectedMemberId].name);
      }
      members[selectedMemberId].hasPin = true;
      members[selectedMemberId].pinHash = hash;
      doLogin(selectedMemberId);
    } else {
      pinTemp = '';
      pinMode = 'set1';
      pinBuffer = '';
      renderDots(0);
      document.getElementById('pin-subtitle').textContent = '⚠️ 불일치! 다시 설정하세요';
    }
  }
}

function showPinError(msg) {
  pinBuffer = '';
  renderDots(0);
  document.getElementById('pin-subtitle').textContent = `⚠️ ${msg}`;
  setTimeout(() => {
    document.getElementById('pin-subtitle').textContent = pinMode==='login' ? 'PIN 6자리를 입력하세요' : '사용할 PIN 6자리를 설정하세요';
  }, 1500);
}

// 마스터 코드로 리셋 - 별도 버튼 (PIN 화면 하단)
// 숫자 키패드라 텍스트 마스터코드 입력 불가 → 리셋 버튼 클릭 → 텍스트 입력 팝업
window.openMasterReset = function() {
  const code = prompt('마스터 코드를 입력하세요:');
  if (!code) return;
  if (code === MASTER_CODE) {
    if (confirm(`${members[selectedMemberId].name}의 PIN을 초기화할까요?`)) {
      set(ref(db, `members/${selectedMemberId}/pinHash`), null).then(() => {
        members[selectedMemberId].hasPin = false;
        members[selectedMemberId].pinHash = null;
        pinMode = 'set1';
        pinBuffer = '';
        renderDots(0);
        document.getElementById('pin-title').textContent = members[selectedMemberId].name;
        document.getElementById('pin-subtitle').textContent = '새 PIN 6자리를 설정하세요';
      });
    }
  } else {
    alert('마스터 코드가 틀렸습니다.');
  }
};

// ===== 로그인 처리 =====
function doLogin(id) {
  currentUser = { id, name: members[id].name, color: memberColor(id) };
  document.getElementById('login-screen').style.display = 'none';
  initApp();
}

// ===== 앱 초기화 =====
function initApp() {
  // 내 아바타
  const av = document.getElementById('my-avatar');
  av.textContent = avatarLetter(currentUser.name);
  av.style.background = currentUser.color;
  document.getElementById('my-name-display').textContent = currentUser.name;

  const pr = ref(db, `presence/${currentUser.id}`);
  set(pr, { online:true, name:currentUser.name });
  onDisconnect(pr).set({ online:false });

  // 멤버 이름/사진 변경 실시간 감지
  MEMBER_DEFS.forEach(def => {
    onValue(ref(db, `members/${def.id}`), snap => {
      const data = snap.val() || {};
      if (data.name) members[def.id].name = data.name;
      if (data.photo !== undefined) members[def.id].photo = data.photo;
      renderMemberCards();
      renderRoomList();
      if (def.id === currentUser.id && data.name) {
        currentUser.name = data.name;
        document.getElementById('my-name-display').textContent = data.name;
        const av = document.getElementById('my-avatar');
        if (data.photo) {
          av.innerHTML = `<img src="${data.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`;
        } else {
          av.textContent = avatarLetter(data.name);
        }
      }
    });
  });

  // 온라인 상태 실시간 감지
  MEMBER_DEFS.forEach(def => {
    onValue(ref(db, `presence/${def.id}/online`), snap => {
      onlineStatus[def.id] = snap.val() === true;
      renderMemberCards();
    });
  });

  renderRoomList();
  renderMemberCards();
  ROOMS.filter(r=>r.members.includes(currentUser.id)).forEach(room =>
    onValue(ref(db, `rooms/${room.id}/messages`), () => renderRoomList())
  );

  // 브라우저 알림 권한 요청
  if ('Notification' in window && Notification.permission === 'default') {
    setTimeout(() => Notification.requestPermission(), 2000);
  }

  // 모든 방 새 메시지 알림 감지
  setupNotifications();

  setTimeout(() => { if(window._deferredPrompt) document.getElementById('install-banner').classList.add('show'); }, 3000);
}

// ===== 이름 변경 =====
window.openNameModal = function() {
  document.getElementById('new-name-input').value = currentUser.name;
  document.getElementById('name-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('new-name-input').focus(), 100);
};

window.saveName = async function() {
  const name = document.getElementById('new-name-input').value.trim();
  if (!name) return;
  await set(ref(db, `members/${currentUser.id}/name`), name);
  document.getElementById('name-modal').classList.add('hidden');
};

// ===== 가족 카드 렌더 =====
let onlineStatus = {};
function renderMemberCards() {
  const c = document.getElementById('member-cards');
  c.innerHTML = '';
  MEMBER_DEFS.forEach(def => {
    if (def.id === currentUser.id) return; // 본인 제외
    const card = document.createElement('div');
    card.className = 'member-card';
    const isOnline = onlineStatus[def.id] === true;
    const photo = members[def.id]?.photo || null;
    const photoHtml = photo
      ? `<img src="${photo}" alt="">`
      : `<span>${avatarLetter(memberName(def.id))}</span>`;
    const editHtml = def.id === currentUser.id
      ? `<div class="photo-edit">📷</div>` : '';
    card.innerHTML = `
      <div class="member-card-top">
        <div class="member-card-photo" style="background:${def.color}" onclick="editPhoto('${def.id}')">
          ${photoHtml}
          <div class="photo-edit">📷</div>
        </div>
        <div class="member-card-info">
          <div class="member-card-name">${memberName(def.id)}</div>
          <div class="member-card-online ${isOnline?'on':''}">${isOnline?'● 온라인':'○ 오프라인'}</div>
        </div>
      </div>
      <div class="member-card-actions">
        <button class="card-btn chat" onclick="quickDM('${def.id}')">💬 채팅</button>
      </div>`;
    c.appendChild(card);
  });
}

// 내 사진 수정
window.editPhoto = function(id) {
  if (id !== currentUser.id) return; // 본인만 수정 가능
  document.getElementById('photo-input').click();
};

window.uploadProfilePhoto = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    await set(ref(db, `members/${currentUser.id}/photo`), ev.target.result);
    members[currentUser.id].photo = ev.target.result;
    // 내 사이드바 아바타도 갱신
    const av = document.getElementById('my-avatar');
    av.innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`;
    renderMemberCards();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

// 빠른 1:1 채팅
window.quickDM = function(otherId) {
  const ids = [currentUser.id, otherId].sort();
  const roomId = ids[0]==='member1'&&ids[1]==='member2' ? 'dm_1_2'
    : ids[0]==='member1'&&ids[1]==='member3' ? 'dm_1_3'
    : ids[0]==='member1'&&ids[1]==='member4' ? 'dm_1_4'
    : ids[0]==='member2'&&ids[1]==='member3' ? 'dm_2_3'
    : ids[0]==='member2'&&ids[1]==='member4' ? 'dm_2_4'
    : 'dm_3_4';
  const room = ROOMS.find(r => r.id === roomId);
  if (room) { switchTab('chats'); openRoom(room); }
};

// 나와의 채팅방
window.openMemoRoom = function() {
  const memoRoom = {
    id: `memo_${currentUser.id}`,
    name: '나와의 채팅',
    isGroup: false,
    isMemo: true,
    members: [currentUser.id]
  };
  switchTab('chats');
  openRoom(memoRoom);
};

// ===== 방 정보 =====
function getRoomInfo(room) {
  if (room.isMemo) return { name:'나와의 채팅', color:'#888', letter:'나' };
  if (room.isGroup) return { name: room.name, color:'#4A90D9', letter:'家' };
  const otherId = room.members.find(m => m !== currentUser.id);
  const photo = members[otherId]?.photo || null;
  return { name: memberName(otherId), color: memberColor(otherId), letter: avatarLetter(memberName(otherId)), photo };
}

// ===== 방 목록 =====
function renderRoomList() {
  const rooms = ROOMS.filter(r => r.members.includes(currentUser.id));
  // 나와의 채팅 방 추가
  const memoRoom = { id:`memo_${currentUser.id}`, name:'나와의 채팅', isGroup:false, isMemo:true, members:[currentUser.id] };

  Promise.all(rooms.map(room => new Promise(res => {
    onValue(ref(db, `rooms/${room.id}/messages`), snap => {
      const msgs = snap.val() ? Object.values(snap.val()) : [];
      res({ room, last: msgs[msgs.length-1]||null });
    }, { onlyOnce:true });
  }))).then(async results => {
    // 나와의 채팅 마지막 메시지
    const memoSnap = await new Promise(res =>
      onValue(ref(db, `rooms/${memoRoom.id}/messages`), snap => res(snap), { onlyOnce:true })
    );
    const memoMsgs = memoSnap.val() ? Object.values(memoSnap.val()) : [];
    results.push({ room: memoRoom, last: memoMsgs[memoMsgs.length-1]||null });

    results.sort((a,b) => (b.last?.timestamp||0)-(a.last?.timestamp||0));
    const c = document.getElementById('room-list');
    c.innerHTML = '';
    results.forEach(({ room, last }) => {
      const info = getRoomInfo(room);
      const item = document.createElement('div');
      item.className = 'room-item' + (currentRoom?.id===room.id?' active':'');
      const avEl = document.createElement('div');
      avEl.className = 'room-avatar-wrap';
      avEl.style.background = room.isMemo ? 'linear-gradient(135deg,#667eea,#764ba2)' : info.color;
      avEl.textContent = info.letter;
      avEl.style.fontSize = room.isGroup ? '16px' : '18px';
      item.appendChild(avEl);
      const ri = document.createElement('div');
      ri.className = 'room-info';
      ri.innerHTML = `<div class="room-name">${info.name}</div><div class="room-preview">${last?(last.type==='image'?'📷 사진':last.text):'메모를 시작하세요'}</div>`;
      item.appendChild(ri);
      const rt = document.createElement('div');
      rt.className = 'room-time';
      rt.textContent = last ? formatTime(last.timestamp) : '';
      item.appendChild(rt);
      item.onclick = () => openRoom(room);
      c.appendChild(item);
    });
  });
}

// ===== 방 열기 =====
window.openRoom = function(room) {
  currentRoom = room;
  document.getElementById('empty-chat').style.display = 'none';
  document.getElementById('chat-main').classList.add('visible');
  const info = getRoomInfo(room);

  // 헤더 아바타
  const hav = document.getElementById('header-avatar');
  hav.style.background = room.isMemo ? 'linear-gradient(135deg,#667eea,#764ba2)' : info.color;
  hav.textContent = info.letter;

  document.getElementById('header-title').textContent = info.name;
  document.getElementById('header-subtitle').textContent =
    room.isMemo ? '나만 보이는 메모' :
    room.isGroup ? `${room.members.length}명` : '일대일 채팅';

  // 나와의 채팅: 삭제 버튼 표시
  const delBtn = document.getElementById('header-del-btn');
  if (delBtn) delBtn.style.display = room.isMemo ? 'flex' : 'none';

  document.getElementById('sidebar').classList.add('hidden');
  renderRoomList();
  isFirstLoad = true;
  // 선택 모드 초기화
  selectMode = false; selectedKeys.clear();
  document.getElementById('select-bar').style.display = 'none';
  document.getElementById('chat-input-area').style.display = 'flex';

  if (msgListener) msgListener();
  msgListener = onValue(ref(db, `rooms/${room.id}/messages`), snap => {
    const raw = snap.val() || {};
    const msgs = Object.values(raw);
    const keys = Object.keys(raw);
    renderMessages(msgs, keys);
    Object.entries(raw).forEach(([key, msg]) => {
      if (msg.senderId !== currentUser.id && !(msg.readBy||{})[currentUser.id]) {
        update(ref(db, `rooms/${room.id}/messages/${key}/readBy`), { [currentUser.id]: true });
      }
    });
    const c = document.getElementById('chat-messages');
    setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
  });
};



window.closeChatMobile = function() {
  window.cancelSelect();
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('chat-main').classList.remove('visible');
  document.getElementById('empty-chat').style.display = 'flex';
  if (msgListener) { msgListener(); msgListener = null; }
  currentRoom = null;
};

// ===== 메시지 렌더 =====
let isFirstLoad = true;
function renderMessages(msgs, keys=[]) {
  const c = document.getElementById('chat-messages');
  const atBottom = isFirstLoad || c.scrollHeight - c.scrollTop - c.clientHeight < 80;
  isFirstLoad = false;
  c.innerHTML = '';
  let lastDate = '';
  msgs.forEach((msg, i) => {
    const msgKey = keys[i] || null;
    const d = new Date(msg.timestamp||Date.now());
    const ds = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
    if (ds !== lastDate) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.innerHTML = `<span>${ds}</span>`;
      c.appendChild(div); lastDate = ds;
    }
    if (msg.type === 'system') {
      const div = document.createElement('div');
      div.style.textAlign = 'center';
      div.innerHTML = `<div class="bubble system">${msg.text}</div>`;
      c.appendChild(div); return;
    }
    const isMe = msg.senderId === currentUser.id;
    const showAvatar = !isMe && (i===0 || msgs[i-1]?.senderId !== msg.senderId);

    // 읽음 (카톡식: 안읽은 수)
    let readInfo = '';
    if (isMe && currentRoom) {
      const roomMembers = currentRoom.members.filter(id => id !== currentUser.id);
      const unreadCount = roomMembers.filter(id => !(msg.readBy||{})[id]).length;
      if (unreadCount > 0) readInfo = `<div class="msg-unread">${unreadCount}</div>`;
    }

    const row = document.createElement('div');
    row.className = `msg-row ${isMe?'me':'other'}`;

    let avatarHtml = '';
    if (!isMe) {
      if (showAvatar) {
        const avEl = makeAvatarEl(msg.senderId, 36, '50%');
        avatarHtml = avEl.outerHTML;
      } else {
        avatarHtml = '<div style="width:36px;flex-shrink:0"></div>';
      }
    }

    let bc;
    if (msg.type === 'image') {
      bc = `<img src="${msg.imageData}" onclick="previewImg(this.src)">`;
    } else {
      bc = msg.text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/ /g,'&nbsp;').replace(/\n/g,'<br>');
    }

    row.innerHTML = `${avatarHtml}<div class="msg-info">${showAvatar&&!isMe?`<div class="msg-sender">${memberName(msg.senderId)}</div>`:''}<div class="msg-content"><div class="bubble ${isMe?'me':'other'}">${bc}</div><div class="msg-meta">${readInfo}<div class="msg-time">${formatTime(msg.timestamp)}</div></div></div></div>`;

    // 나와의 채팅: 말풍선 탭 → 선택 모드
    if (currentRoom?.isMemo && msgKey) {
      const bubble = row.querySelector('.bubble');
      bubble.style.cursor = 'pointer';
      bubble.addEventListener('click', () => {
        if (!selectMode) enterSelectMode();
        if (selectedKeys.has(msgKey)) {
          selectedKeys.delete(msgKey);
          bubble.classList.remove('selected-bubble');
        } else {
          selectedKeys.add(msgKey);
          bubble.classList.add('selected-bubble');
        }
        updateSelectBar();
      });
    }

    c.appendChild(row);
  });
  if (atBottom || msgs.length <= 1) c.scrollTop = c.scrollHeight;
}

// ===== 전송 =====
window.sendMsg = function() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentRoom) return;
  push(ref(db, `rooms/${currentRoom.id}/messages`), {
    text, senderId:currentUser.id, senderName:currentUser.name, timestamp:Date.now(), type:'text'
  });
  input.value = ''; input.style.height = 'auto';
};

window.sendImage = function(e) {
  const file = e.target.files[0];
  if (!file || !currentRoom) return;
  const reader = new FileReader();
  reader.onload = ev => {
    push(ref(db, `rooms/${currentRoom.id}/messages`), {
      text:'', imageData:ev.target.result,
      senderId:currentUser.id, senderName:currentUser.name, timestamp:Date.now(), type:'image'
    });
  };
  reader.readAsDataURL(file); e.target.value = '';
};

window.previewImg = src => { document.getElementById('img-preview-src').src=src; document.getElementById('img-preview').classList.add('show'); };

// ===== 나와의 채팅 선택 삭제 =====
let selectMode = false;
let selectedKeys = new Set();

function enterSelectMode() {
  selectMode = true;
  selectedKeys.clear();
  document.getElementById('select-bar').style.display = 'flex';
  document.getElementById('chat-input-area').style.display = 'none';
  updateSelectBar();
}

window.cancelSelect = function() {
  selectMode = false;
  selectedKeys.clear();
  document.getElementById('select-bar').style.display = 'none';
  document.getElementById('chat-input-area').style.display = 'flex';
  // 선택 표시 초기화
  document.querySelectorAll('.bubble.selected-bubble').forEach(b => b.classList.remove('selected-bubble'));
};

function updateSelectBar() {
  document.getElementById('select-count').textContent = `${selectedKeys.size}개 선택됨`;
}

window.deleteSelected = async function() {
  if (selectedKeys.size === 0) return;
  if (!confirm(`선택한 ${selectedKeys.size}개를 삭제할까요?`)) return;
  const updates = {};
  selectedKeys.forEach(k => { updates[`rooms/${currentRoom.id}/messages/${k}`] = null; });
  await update(ref(db, '/'), updates);
  window.cancelSelect();
};
window.autoResize = el => { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; };
// ===== 브라우저 알림 =====
let lastMsgTimestamps = {};
function setupNotifications() {
  ROOMS.filter(r => r.members.includes(currentUser.id)).forEach(room => {
    onValue(ref(db, `rooms/${room.id}/messages`), snap => {
      if (!snap.val()) return;
      const msgs = Object.values(snap.val());
      const last = msgs[msgs.length - 1];
      if (!last) return;

      // 앱이 포그라운드이고 현재 방이면 알림 안 띄움
      const isCurrentRoom = currentRoom?.id === room.id;
      const isNew = last.timestamp > (lastMsgTimestamps[room.id] || 0);
      const isFromOther = last.senderId !== currentUser.id;

      if (isNew && isFromOther) {
        lastMsgTimestamps[room.id] = last.timestamp;
        if (!isCurrentRoom || document.hidden) {
          sendNotification(room, last);
        }
      }

      // 앱 배지 (안읽은 메시지 수)
      updateBadge(msgs);
    });
  });
}

function sendNotification(room, msg) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const info = getRoomInfo(room);
  const senderName = memberName(msg.senderId);
  const body = msg.type === 'image' ? '📷 사진을 보냈습니다' : msg.text;
  const title = room.isGroup ? `${info.name} - ${senderName}` : senderName;
  const n = new Notification(title, {
    body: body.length > 50 ? body.slice(0,50)+'...' : body,
    icon: '/icon-192.png',
    badge: '/icon-192.png',
    tag: room.id,
    renotify: true,
  });
  n.onclick = () => { window.focus(); openRoom(room); n.close(); };
}

function updateBadge(allMsgs) {
  let total = 0;
  ROOMS.filter(r=>r.members.includes(currentUser.id)).forEach(room => {
    // 각 방에서 내가 안읽은 메시지 (sendNotification 흐름에서 이미 집계)
  });
  // navigator.setAppBadge 지원 시
  if ('setAppBadge' in navigator) {
    navigator.setAppBadge(total).catch(()=>{});
  }
}

window.switchTab = tab => {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='chats')||(i===1&&tab==='members')));
  document.getElementById('room-list').style.display=tab==='chats'?'block':'none';
  document.getElementById('member-panel').style.display=tab==='members'?'flex':'none';
  document.getElementById('member-panel').style.flexDirection='column';
  if(tab==='members') renderMemberCards();
};
function formatTime(ts){if(!ts)return'';const d=new Date(ts),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return`${h<12?'오전':'오후'} ${h%12||12}:${m}`;}
